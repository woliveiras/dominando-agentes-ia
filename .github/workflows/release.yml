name: Release Book

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc calibre

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Install TinyTeX
        run: |
          quarto install tinytex

      - name: Install LaTeX packages for Portuguese
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr install babel-portuges hyphen-portuguese collection-langportuguese

      - name: Render book to HTML
        run: |
          quarto render book/ --to html --verbose

      - name: Render book to EPUB
        run: |
          quarto render book/ --to epub --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: book-artifacts
          path: |
            book/_book/
          retention-days: 1

  create-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: book-artifacts
          path: book/_book

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            book/_book/Dominando-Agentes-de-IA.epub
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-gh-pages:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: book-artifacts
          path: book/_book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_book
          publish_branch: gh-pages
