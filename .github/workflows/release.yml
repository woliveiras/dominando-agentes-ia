name: Release Book

on:
  push:
    tags:
      - 'v*'  # Trigger em tags que começam com 'v', ex: v1.0.0, v2.1.3

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job para build do PDF
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome for Mermaid diagrams
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Install TinyTeX
        run: |
          quarto install tinytex

      - name: Configure TinyTeX repository
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"

          # Atualiza GPG e wget para evitar problemas de assinatura
          sudo apt-get update
          sudo apt-get install -y gnupg wget

          # Usa mirror CTAN confiável
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet

          # Retry logic com backoff exponencial para tlmgr update
          n=0
          until [ "$n" -ge 3 ]; do
            echo "Tentativa $((n+1)) de atualizar tlmgr..."
            if tlmgr update --self --all; then
              echo "✓ tlmgr atualizado com sucesso"
              break
            fi
            echo "✗ tlmgr update falhou, aguardando $((n+1))0s..."
            sleep $((n+1))0
            n=$((n+1))
          done

          # Se falhou todas as tentativas, continua mesmo assim
          if [ "$n" -ge 3 ]; then
            echo "⚠ tlmgr update falhou após 3 tentativas, continuando com versão atual..."
          fi

      - name: Install LaTeX packages for Portuguese and KOMA-Script
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          # Retry logic para instalação de pacotes
          for i in {1..3}; do
            echo "Tentativa $i de instalar pacotes LaTeX..."
            tlmgr install \
              babel-portuges \
              hyphen-portuguese \
              collection-langportuguese \
              koma-script \
              fancyvrb \
              framed \
              tcolorbox \
              environ \
              trimspaces \
              pgf \
              booktabs && break || {
                echo "Falha na tentativa $i, aguardando 10s..."
                sleep 10
              }
          done

      - name: Test Chrome for Mermaid rendering
        run: |
          echo "=== Testando Chrome ==="
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          $CHROME_PATH --headless --disable-gpu --print-to-pdf=/tmp/test.pdf --no-sandbox about:blank 2>&1 | grep -v "ERROR:dbus" | grep -v "ERROR:object_proxy" || true
          sleep 2
          if [ -f "/tmp/test.pdf" ] && [ -s "/tmp/test.pdf" ]; then
            echo "✓ Chrome funcionando corretamente ($(stat -c%s /tmp/test.pdf) bytes)"
            rm /tmp/test.pdf
          else
            echo "✗ Chrome não conseguiu gerar PDF"
            ls -la /tmp/test.pdf 2>/dev/null || echo "Arquivo não existe"
            exit 1
          fi

      - name: Render PDF
        timeout-minutes: 25
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"

          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-extensions --disable-dbus"
          export PUPPETEER_TIMEOUT=30000

          echo "=== Renderizando PDF ==="
          quarto render book/ --to pdf --verbose

      - name: Verify PDF generation
        run: |
          if [ ! -f "book/_book/Dominando-Agentes-de-IA.pdf" ]; then
            echo "✗ PDF não foi gerado!"
            exit 1
          fi

          PDF_SIZE=$(stat -c%s book/_book/Dominando-Agentes-de-IA.pdf)
          echo "✓ PDF gerado com sucesso: $(numfmt --to=iec-i --suffix=B $PDF_SIZE)"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-artifact
          path: book/_book/Dominando-Agentes-de-IA.pdf
          retention-days: 1

  # Job para build do EPUB
  build-epub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome for Mermaid diagrams
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Render EPUB
        timeout-minutes: 15
        run: |
          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu"
          export PUPPETEER_TIMEOUT=30000

          echo "=== Renderizando EPUB ==="
          quarto render book/ --to epub --verbose

      - name: Verify EPUB generation
        run: |
          if [ ! -f "book/_book/Dominando-Agentes-de-IA.epub" ]; then
            echo "✗ EPUB não foi gerado!"
            exit 1
          fi

          EPUB_SIZE=$(stat -c%s book/_book/Dominando-Agentes-de-IA.epub)
          echo "✓ EPUB gerado com sucesso: $(numfmt --to=iec-i --suffix=B $EPUB_SIZE)"

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: epub-artifact
          path: book/_book/Dominando-Agentes-de-IA.epub
          retention-days: 1

  # Job para build do HTML
  build-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome for Mermaid diagrams
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Render HTML for GitHub Pages
        timeout-minutes: 12
        run: |
          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu"
          export PUPPETEER_TIMEOUT=30000

          echo "=== Renderizando HTML para GitHub Pages ==="
          quarto render book/ --to html --verbose

      - name: Verify HTML generation
        run: |
          if [ ! -f "book/_book/index.html" ]; then
            echo "✗ HTML não foi gerado!"
            exit 1
          fi
          echo "✓ HTML gerado com sucesso!"

      - name: Upload HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-artifacts
          path: book/_book/
          retention-days: 1

  # Job para criar release (depende de PDF e EPUB)
  create-release:
    needs: [build-pdf, build-epub]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-artifact
          path: ./artifacts

      - name: Download EPUB artifact
        uses: actions/download-artifact@v4
        with:
          name: epub-artifact
          path: ./artifacts

      - name: Extract version from tag
        id: version
        run: |
          # Remove o 'v' do início da tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão: $VERSION"

      - name: Verify downloaded files
        run: |
          echo "=== Arquivos baixados ==="
          ls -lh ./artifacts/

          if [ ! -f "./artifacts/Dominando-Agentes-de-IA.pdf" ]; then
            echo "✗ PDF não encontrado nos artefatos!"
            exit 1
          fi

          if [ ! -f "./artifacts/Dominando-Agentes-de-IA.epub" ]; then
            echo "⚠ EPUB não encontrado nos artefatos!"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Versão ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/Dominando-Agentes-de-IA.pdf
            ./artifacts/Dominando-Agentes-de-IA.epub
          body: |
            📚 **Livro: Dominando Agentes de IA**

            ## Downloads Disponíveis

            - 📄 **PDF**: Ideal para impressão e leitura offline
            - 📱 **EPUB**: Compatível com e-readers (Kindle, Kobo, etc)
            - 🌐 **HTML**: Acesse a versão online via [GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)

            ---

            **Versão:** ${{ steps.version.outputs.version }}
            **Tag:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            🤖 Gerado automaticamente com GitHub Actions

  # Job para deploy no GitHub Pages (depende do HTML)
  deploy-gh-pages:
    needs: build-html
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download HTML artifacts
        uses: actions/download-artifact@v4
        with:
          name: html-artifacts
          path: book/_book

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
