name: Create Release with PDF

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v3

        - name: Set up Quarto
          uses: quarto-dev/quarto-actions/setup@v2
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tinytex: true

        - name: Install dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y pandoc

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: '3.13'

        - name: Install uv and sync Python dependencies
          run: |
            pip install uv
            uv sync

        - name: Install TinyTeX
          run: |
            quarto install tinytex

        - name: Install LaTeX packages for Portuguese
          run: |
            export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
            tlmgr install babel-portuges hyphen-portuguese collection-langportuguese

        - name: Render book
          run: |
            quarto render book/

        - name: Deploy to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: book/_book
            publish_branch: gh-pages

  build-and-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv and sync Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Install TinyTeX
        run: |
          quarto install tinytex

      - name: Install LaTeX packages for Portuguese
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr install babel-portuges hyphen-portuguese collection-langportuguese

      - name: Install Calibre for MOBI conversion
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Render book to PDF
        run: |
          quarto render book/ --to pdf

      - name: Render book to EPUB
        run: |
          quarto render book/ --to epub

      - name: Convert EPUB to MOBI
        run: |
          ebook-convert book/_book/Dominando-Agentes-de-IA.epub book/_book/Dominando-Agentes-de-IA.mobi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            book/_book/Dominando-Agentes-de-IA.pdf
            book/_book/Dominando-Agentes-de-IA.epub
            book/_book/Dominando-Agentes-de-IA.mobi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
