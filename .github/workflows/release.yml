name: Release Book

on:
  push:
    tags:
      - 'v*'  # Trigger em tags que começam com 'v', ex: v1.0.0, v2.1.3

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Job para build do PDF
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Quarto Environment
        uses: ./.github/actions/setup-quarto-env
        id: setup
        with:
          install-latex: 'true'

      - name: Render PDF
        timeout-minutes: 25
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"

          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup.outputs.chrome-path }}"
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-extensions --disable-dbus"
          export PUPPETEER_TIMEOUT=30000

          # Debug: mostra configuração
          echo "=== Configuração de ambiente ==="
          echo "Chrome: $CHROME_BIN"
          echo "TinyTeX: $(which pdflatex)"
          echo "Quarto: $(quarto --version)"

          echo "=== Renderizando PDF ==="
          set +e
          quarto render book/ --to pdf --verbose 2>&1 | tee /tmp/quarto-render.log
          RENDER_EXIT=$?
          set -e

          if [ $RENDER_EXIT -ne 0 ]; then
            echo ""
            echo "✗ Erro no render (exit code: $RENDER_EXIT)"
            echo "=== Últimas 50 linhas do log ==="
            tail -50 /tmp/quarto-render.log
            exit 1
          fi
          echo "✓ Renderização concluída com sucesso"

      - name: Verify PDF generation
        run: |
          echo "=== Verificando arquivos gerados ==="

          if [ ! -d "book/_book/" ]; then
            echo "✗ Diretório book/_book/ não foi criado!"
            echo "=== Últimas 100 linhas do log de renderização ==="
            tail -100 /tmp/quarto-render.log 2>/dev/null || echo "Log não encontrado"
            exit 1
          fi

          echo "Conteúdo de book/_book/:"
          ls -lh book/_book/

          if [ ! -f "book/_book/Dominando-Agentes-de-IA.pdf" ]; then
            echo "✗ PDF não foi gerado!"
            exit 1
          fi

          PDF_SIZE=$(stat -c%s book/_book/Dominando-Agentes-de-IA.pdf)
          echo "✓ PDF gerado com sucesso: $(numfmt --to=iec-i --suffix=B $PDF_SIZE)"

          # Verifica tamanho mínimo (deve ter pelo menos 100KB)
          if [ $PDF_SIZE -lt 102400 ]; then
            echo "⚠ Aviso: PDF muito pequeno ($PDF_SIZE bytes), pode estar incompleto"
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-artifact
          path: book/_book/Dominando-Agentes-de-IA.pdf
          retention-days: 1

  # Job para build do EPUB
  build-epub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Quarto Environment
        uses: ./.github/actions/setup-quarto-env
        id: setup
        with:
          install-latex: 'false'

      - name: Render EPUB
        timeout-minutes: 15
        run: |
          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup.outputs.chrome-path }}"
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu"
          export PUPPETEER_TIMEOUT=30000

          echo "=== Renderizando EPUB ==="
          quarto render book/ --to epub --verbose

      - name: Verify EPUB generation
        run: |
          if [ ! -f "book/_book/Dominando-Agentes-de-IA.epub" ]; then
            echo "✗ EPUB não foi gerado!"
            exit 1
          fi

          EPUB_SIZE=$(stat -c%s book/_book/Dominando-Agentes-de-IA.epub)
          echo "✓ EPUB gerado com sucesso: $(numfmt --to=iec-i --suffix=B $EPUB_SIZE)"

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: epub-artifact
          path: book/_book/Dominando-Agentes-de-IA.epub
          retention-days: 1

  # Job para build do HTML
  build-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Quarto Environment
        uses: ./.github/actions/setup-quarto-env
        id: setup
        with:
          install-latex: 'false'

      - name: Render HTML for GitHub Pages
        timeout-minutes: 12
        run: |
          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup.outputs.chrome-path }}"
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu"
          export PUPPETEER_TIMEOUT=30000

          echo "=== Renderizando HTML para GitHub Pages ==="
          quarto render book/ --to html --verbose

      - name: Verify HTML generation
        run: |
          if [ ! -f "book/_book/index.html" ]; then
            echo "✗ HTML não foi gerado!"
            exit 1
          fi
          echo "✓ HTML gerado com sucesso!"

      - name: Upload HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-artifacts
          path: book/_book/
          retention-days: 1

  # Job para criar release (depende de PDF e EPUB)
  create-release:
    needs: [build-pdf, build-epub]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: pdf-artifact
          path: ./artifacts

      - name: Download EPUB artifact
        uses: actions/download-artifact@v4
        with:
          name: epub-artifact
          path: ./artifacts

      - name: Extract version from tag
        id: version
        run: |
          # Remove o 'v' do início da tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão: $VERSION"

      - name: Verify downloaded files
        run: |
          echo "=== Arquivos baixados ==="
          ls -lh ./artifacts/

          if [ ! -f "./artifacts/Dominando-Agentes-de-IA.pdf" ]; then
            echo "✗ PDF não encontrado nos artefatos!"
            exit 1
          fi

          if [ ! -f "./artifacts/Dominando-Agentes-de-IA.epub" ]; then
            echo "⚠ EPUB não encontrado nos artefatos!"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Versão ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/Dominando-Agentes-de-IA.pdf
            ./artifacts/Dominando-Agentes-de-IA.epub
          body: |
            📚 **Livro: Dominando Agentes de IA**

            ## Downloads Disponíveis

            - 📄 **PDF**: Ideal para impressão e leitura offline
            - 📱 **EPUB**: Compatível com e-readers (Kindle, Kobo, etc)
            - 🌐 **HTML**: Acesse a versão online via [GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)

            ---

            **Versão:** ${{ steps.version.outputs.version }}
            **Tag:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            🤖 Gerado automaticamente com GitHub Actions

  # Job para deploy no GitHub Pages (depende do HTML)
  deploy-gh-pages:
    needs: build-html
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download HTML artifacts
        uses: actions/download-artifact@v4
        with:
          name: html-artifacts
          path: book/_book

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
