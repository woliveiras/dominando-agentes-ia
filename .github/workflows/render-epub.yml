name: Render EPUB

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/render-epub.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup:
    uses: ./.github/workflows/setup-dependencies.yml

  render-epub:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/uv
            /usr/share/texlive
            ~/.cache/puppeteer
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Install Chromium for Mermaid diagrams
        run: |
          if [ ! -d "$HOME/.cache/puppeteer" ]; then
            quarto install chromium
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Sync Python dependencies
        run: uv sync

      - name: Render book to EPUB
        env:
          QUARTO_CHROMIUM_PATH: /root/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome
        run: |
          quarto render book/ --to epub --verbose

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v5
        with:
          name: book-epub
          path: book/_book/Dominando-Agentes-de-IA.epub
          retention-days: 7
