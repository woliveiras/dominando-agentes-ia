name: 📚 Book CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13.5'
  UV_VERSION: '0.9.5'
  QUARTO_VERSION: '1.8.25'

jobs:
  # ========================================
  # 1. VALIDAÇÃO DE MARKDOWN E QUARTO
  # ========================================
  validate-markdown:
    name: 📝 Validate Markdown & Quarto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          
      - name: Install markdown linters
        run: |
          npm install -g markdownlint-cli
          npm install -g markdown-link-check
          
      - name: Run markdownlint
        run: |
          echo "🔍 Checking markdown formatting..."
          markdownlint book/**/*.qmd book/**/*.md \
            --config .markdownlint.json \
            --ignore book/_book \
            || echo "::warning::Markdown linting issues found"
            
      - name: Check markdown links
        run: |
          echo "🔗 Checking links..."
          find book -name "*.qmd" -o -name "*.md" | \
            grep -v "_book" | \
            xargs -I {} markdown-link-check {} \
            --config .markdown-link-check.json \
            || echo "::warning::Some links may be broken"
            
      - name: Validate Quarto syntax
        run: |
          echo "📋 Validating Quarto files..."
          for file in $(find book -name "*.qmd" | grep -v "_book"); do
            echo "Checking: $file"
            # Verifica sintaxe básica do YAML front matter
            head -20 "$file" | grep -E "^(---|#)" || echo "::warning::Possible YAML issue in $file"
          done

  # ========================================
  # 2. TESTE DE CÓDIGO PYTHON
  # ========================================
  test-python-code:
    name: 🐍 Test Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install dependencies
        run: |
          echo "📦 Installing Python dependencies..."
          uv sync --all-extras --dev
          
      - name: Extract and test code blocks
        run: |
          echo "🧪 Extracting and testing Python code blocks..."
          python .github/scripts/extract_test_code.py
          
      - name: Test example notebooks
        if: hashFiles('book/sandbox/**/*.py') != ''
        run: |
          echo "📓 Testing example scripts..."
          for script in $(find book/sandbox -name "*.py"); do
            echo "Testing: $script"
            timeout 30 uv run python "$script" --test-mode || \
              echo "::warning::Script failed or timed out: $script"
          done
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-test-results
          path: |
            test-results/
            .coverage

  # ========================================
  # 3. VALIDAÇÃO DE REFERÊNCIAS
  # ========================================
  validate-references:
    name: 📚 Validate References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install validation tools
        run: |
          pip install bibtexparser pyyaml
          
      - name: Validate bibliography
        run: |
          echo "📖 Validating references.bib..."
          python .github/scripts/validate_bibliography.py
          
      - name: Check citation consistency
        run: |
          echo "🔍 Checking citation consistency..."
          python .github/scripts/check_citations.py

  # ========================================
  # 4. BUILD DO LIVRO
  # ========================================
  build-book:
    name: 📖 Build Book
    runs-on: ubuntu-latest
    needs: [validate-markdown, test-python-code, validate-references]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
          
      - name: Setup Chrome for Mermaid diagrams
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          
      - name: Verify Chrome installation
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          
      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version
          
      - name: Configure Puppeteer for Mermaid
        run: |
          # Configura Puppeteer para usar o Chrome instalado
          echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          
          # Cria config do Puppeteer para Mermaid CLI
          cat > puppeteer-config.json << EOF
          {
            "executablePath": "${{ steps.setup-chrome.outputs.chrome-path }}",
            "args": [
              "--no-sandbox",
              "--disable-setuid-sandbox",
              "--disable-dev-shm-usage",
              "--disable-gpu",
              "--disable-software-rasterizer",
              "--disable-extensions",
              "--disable-background-networking"
            ],
            "timeout": 60000
          }
          EOF
          
          echo "Puppeteer config created:"
          cat puppeteer-config.json
          
          # Define variável para mmdc usar
          echo "PUPPETEER_CONFIG_PATH=$(pwd)/puppeteer-config.json" >> $GITHUB_ENV
          
      - name: Test Mermaid rendering
        run: |
          echo "🧪 Testing Mermaid rendering..."
          
          # Cria diagrama de teste
          cat > /tmp/test-diagram.mmd << EOF
          graph LR
            A[Test] --> B[Diagram]
          EOF
          
          # Tenta renderizar com configuração do Puppeteer
          if mmdc -i /tmp/test-diagram.mmd -o /tmp/test-output.png -p puppeteer-config.json -b transparent; then
            echo "✅ Mermaid rendering successful"
            ls -lh /tmp/test-output.png
          else
            echo "❌ Mermaid rendering failed"
            exit 1
          fi
          
      - name: Install image conversion tools
        run: |
          echo "🖼️  Installing image conversion tools..."
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick poppler-utils
          
          # Verify installations
          rsvg-convert --version
          convert --version | head -3
          pdftoppm -v
          
      - name: Install LaTeX
        run: |
          echo "📦 Installing TinyTeX for PDF generation..."
          quarto install tinytex
          
      - name: Configure TinyTeX
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          
          # Atualiza repositório para mirror confiável
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
          
          # Tenta atualizar tlmgr (com retry)
          for i in {1..3}; do
            echo "Tentativa $i de atualizar tlmgr..."
            if tlmgr update --self --all; then
              echo "✓ tlmgr atualizado com sucesso"
              break
            fi
            echo "✗ Falhou, aguardando ${i}0s..."
            sleep $((i*10))
          done
          
      - name: Install LaTeX packages
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          
          # Instala pacotes necessários (com retry)
          for i in {1..3}; do
            echo "Tentativa $i de instalar pacotes LaTeX..."
            tlmgr install \
              babel-portuges \
              hyphen-portuguese \
              collection-langportuguese \
              koma-script \
              fancyvrb \
              framed \
              tcolorbox \
              environ \
              trimspaces \
              pgf \
              booktabs && break || {
                echo "Falha, aguardando 10s..."
                sleep 10
              }
          done
          
      - name: Verify LaTeX installation
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          echo "🔍 Verifying LaTeX installation..."
          tlmgr --version
          pdflatex --version
          
      - name: Install Python dependencies
        run: uv sync
        
      - name: Build HTML version
        run: |
          echo "🌐 Building HTML version..."
          cd book
          quarto render --to html
          
      - name: Build PDF version
        timeout-minutes: 30
        run: |
          echo "📄 Building PDF version..."
          cd book
          
          # Set Chrome path for Quarto
          export CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}
          export PUPPETEER_EXECUTABLE_PATH=${{ steps.setup-chrome.outputs.chrome-path }}
          
          quarto render --to pdf
          
      - name: Build EPUB version
        continue-on-error: true
        run: |
          echo "📱 Building EPUB version..."
          cd book
          quarto render --to epub || echo "::warning::EPUB build failed"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-builds
          path: |
            book/_book/
          if-no-files-found: warn
            
      - name: Check build sizes
        if: always()
        run: |
          echo "📊 Build statistics:"
          ls -lh book/_book/ || echo "Build directory not found"
          [ -f book/_book/index.html ] && echo "✅ HTML build successful" || echo "❌ HTML build failed"
          [ -f book/_book/*.pdf ] && echo "✅ PDF build successful" || echo "⚠️ PDF build skipped/failed"
          [ -f book/_book/*.epub ] && echo "✅ EPUB build successful" || echo "⚠️ EPUB build skipped/failed"

  # ========================================
  # 5. ANÁLISE DE QUALIDADE
  # ========================================
  quality-report:
    name: 📊 Quality Report
    runs-on: ubuntu-latest
    needs: [build-book]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Download artifacts
        uses: actions/download-artifact@v6
        
      - name: Generate quality report
        run: |
          echo "📈 Generating quality report..."
          python .github/scripts/generate_quality_report.py
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quality-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

