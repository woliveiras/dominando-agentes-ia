name: Release Book

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-book-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Install Chromium for Mermaid diagrams
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          chromium-browser --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Install TinyTeX
        run: |
          quarto install tinytex

      - name: Install LaTeX packages for Portuguese and KOMA-Script
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr install \
            babel-portuges \
            hyphen-portuguese \
            collection-langportuguese \
            koma-script \
            fancyvrb \
            framed \
            tcolorbox \
            environ \
            trimspaces \
            pgf \
            booktabs

      - name: Configure Quarto for CI
        run: |
          # Backup do arquivo original
          cp book/_quarto.yml book/_quarto.yml.bak
          # Remove a linha mermaid-format para usar o padrão do Quarto
          sed -i '/mermaid-format: png/d' book/_quarto.yml
          echo "=== Configuração modificada ==="
          grep -A5 "pdf:" book/_quarto.yml

      - name: Test Chromium for Mermaid rendering
        run: |
          echo "=== Testando Chromium ==="
          chromium-browser --headless --disable-gpu --print-to-pdf=/tmp/test.pdf --no-sandbox about:blank 2>&1 | grep -v "ERROR:dbus" | grep -v "ERROR:object_proxy" || true
          sleep 2
          if [ -f "/tmp/test.pdf" ] && [ -s "/tmp/test.pdf" ]; then
            echo "✓ Chromium funcionando corretamente ($(stat -f%z /tmp/test.pdf 2>/dev/null || stat -c%s /tmp/test.pdf) bytes)"
            rm /tmp/test.pdf
          else
            echo "✗ Chromium não conseguiu gerar PDF"
            ls -la /tmp/test.pdf 2>/dev/null || echo "Arquivo não existe"
            exit 1
          fi

      - name: Render book to PDF
        timeout-minutes: 20
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          # Configuração do Chromium para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
          export CHROME_BIN=/usr/bin/chromium-browser
          # Flags otimizadas para evitar timeout e uso excessivo de recursos
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-extensions --disable-dbus"
          # Desabilita daemon para evitar processos pendurados
          export QUARTO_DENO_EXTRA_OPTIONS="--no-check"
          # Renderiza e filtra erros conhecidos do dbus (são esperados em CI)
          quarto render book/ --to pdf --verbose 2>&1 | tee /tmp/quarto-render.log | grep -v "ERROR:dbus" | grep -v "ERROR:object_proxy" || true
          # Verifica se o comando terminou com sucesso
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Erro no render, veja o log completo:"
            cat /tmp/quarto-render.log
            exit 1
          fi

      - name: Restore Quarto config
        if: always()
        run: |
          mv book/_quarto.yml.bak book/_quarto.yml

      - name: Verify PDF generation
        run: |
          echo "=== Verificando arquivos gerados ==="
          ls -lh book/_book/
          if [ -f "book/_book/Dominando-Agentes-de-IA.pdf" ]; then
            echo "✓ PDF gerado com sucesso!"
            ls -lh book/_book/Dominando-Agentes-de-IA.pdf
          else
            echo "✗ PDF não foi gerado!"
            exit 1
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Dominando Agentes de IA - ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: |
            book/_book/Dominando-Agentes-de-IA.pdf
          body: |
            📚 **Livro: Dominando Agentes de IA**

            Versão gerada automaticamente do livro em PDF.

            **Commit:** ${{ github.sha }}
            **Data:** ${{ steps.date.outputs.date }}

            ---
            🤖 Gerado automaticamente com GitHub Actions

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf-${{ steps.date.outputs.date }}
          path: book/_book/Dominando-Agentes-de-IA.pdf
          retention-days: 90
