name: Release Book

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-book-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome for Mermaid diagrams
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Install Node.js and Mermaid CLI
        run: |
          # Instala Node.js para garantir que mermaid-cli funcione
          sudo apt-get update
          sudo apt-get install -y nodejs npm
          
          # Instala mermaid-cli globalmente
          sudo npm install -g @mermaid-js/mermaid-cli
          
          # Verifica instalação
          mmdc --version || echo "⚠ mermaid-cli não instalado corretamente"

      - name: Install TinyTeX
        run: |
          quarto install tinytex

      - name: Configure TinyTeX repository
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          
          # Atualiza GPG e wget para evitar problemas de assinatura
          sudo apt-get update
          sudo apt-get install -y gnupg wget
          
          # Usa mirror CTAN confiável
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
          
          # Retry logic com backoff exponencial para tlmgr update
          n=0
          until [ "$n" -ge 3 ]; do
            echo "Tentativa $((n+1)) de atualizar tlmgr..."
            if tlmgr update --self --all; then
              echo "✓ tlmgr atualizado com sucesso"
              break
            fi
            echo "✗ tlmgr update falhou, aguardando $((n+1))0s..."
            sleep $((n+1))0
            n=$((n+1))
          done
          
          # Se falhou todas as tentativas, continua mesmo assim
          if [ "$n" -ge 3 ]; then
            echo "⚠ tlmgr update falhou após 3 tentativas, continuando com versão atual..."
          fi

      - name: Install LaTeX packages for Portuguese and KOMA-Script
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          # Retry logic para instalação de pacotes
          for i in {1..3}; do
            echo "Tentativa $i de instalar pacotes LaTeX..."
            tlmgr install \
              babel-portuges \
              hyphen-portuguese \
              collection-langportuguese \
              koma-script \
              fancyvrb \
              framed \
              tcolorbox \
              environ \
              trimspaces \
              pgf \
              booktabs && break || {
                echo "Falha na tentativa $i, aguardando 10s..."
                sleep 10
              }
          done

      - name: Configure Quarto for CI
        run: |
          # Backup do arquivo original
          cp book/_quarto.yml book/_quarto.yml.bak
          
          # Remove a linha mermaid-format para usar o padrão do Quarto
          sed -i '/mermaid-format: png/d' book/_quarto.yml
          
          # Adiciona timeout para Mermaid (evita travamentos)
          cat >> book/_quarto.yml << 'EOF'
          
          # CI-specific settings
          execute:
            freeze: false
            daemon: false
          
          format:
            pdf:
              mermaid:
                theme: default
                timeout: 30000  # 30 segundos por diagrama
          EOF
          
          echo "=== Configuração modificada ==="
          cat book/_quarto.yml

      - name: Test Chrome for Mermaid rendering
        run: |
          echo "=== Testando Chrome ==="
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          $CHROME_PATH --headless --disable-gpu --print-to-pdf=/tmp/test.pdf --no-sandbox about:blank 2>&1 | grep -v "ERROR:dbus" | grep -v "ERROR:object_proxy" || true
          sleep 2
          if [ -f "/tmp/test.pdf" ] && [ -s "/tmp/test.pdf" ]; then
            echo "✓ Chrome funcionando corretamente ($(stat -c%s /tmp/test.pdf) bytes)"
            rm /tmp/test.pdf
          else
            echo "✗ Chrome não conseguiu gerar PDF"
            ls -la /tmp/test.pdf 2>/dev/null || echo "Arquivo não existe"
            exit 1
          fi

      - name: Render book to PDF
        timeout-minutes: 30
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          
          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          
          # Flags otimizadas para evitar timeout e uso excessivo de recursos
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-extensions --disable-dbus"
          
          # Timeout para operações do Puppeteer (30 segundos por diagrama)
          export PUPPETEER_TIMEOUT=30000
          
          # Debug: mostra configuração
          echo "=== Configuração de ambiente ==="
          echo "Chrome: $CHROME_BIN"
          echo "TinyTeX: $(which pdflatex)"
          echo "Quarto: $(quarto --version)"
          
          # Renderiza com timeout por comando (usa timeout do sistema)
          echo "=== Iniciando renderização do PDF ==="
          timeout 25m quarto render book/ --to pdf --verbose 2>&1 | tee /tmp/quarto-render.log &
          
          # PID do processo de renderização
          RENDER_PID=$!
          
          # Aguarda conclusão ou timeout
          if wait $RENDER_PID; then
            echo "✓ Renderização concluída"
          else
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "✗ Timeout: Renderização demorou mais de 25 minutos"
              echo "=== Últimas 100 linhas do log ==="
              tail -100 /tmp/quarto-render.log
            else
              echo "✗ Erro no render (exit code: $EXIT_CODE)"
              echo "=== Log completo ==="
              cat /tmp/quarto-render.log
            fi
            exit 1
          fi

      - name: Restore Quarto config
        if: always()
        run: |
          if [ -f book/_quarto.yml.bak ]; then
            mv book/_quarto.yml.bak book/_quarto.yml
            echo "✓ Configuração original restaurada"
          else
            echo "⚠ Backup da configuração não encontrado, pulando restore"
          fi

      - name: Verify PDF generation
        run: |
          echo "=== Verificando arquivos gerados ==="
          ls -lh book/_book/
          if [ -f "book/_book/Dominando-Agentes-de-IA.pdf" ]; then
            echo "✓ PDF gerado com sucesso!"
            ls -lh book/_book/Dominando-Agentes-de-IA.pdf
          else
            echo "✗ PDF não foi gerado!"
            exit 1
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Dominando Agentes de IA - ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: |
            book/_book/Dominando-Agentes-de-IA.pdf
          body: |
            📚 **Livro: Dominando Agentes de IA**

            Versão gerada automaticamente do livro em PDF.

            **Commit:** ${{ github.sha }}
            **Data:** ${{ steps.date.outputs.date }}

            ---
            🤖 Gerado automaticamente com GitHub Actions

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf-${{ steps.date.outputs.date }}
          path: book/_book/Dominando-Agentes-de-IA.pdf
          retention-days: 90
