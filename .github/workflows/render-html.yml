name: Render HTML

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/render-html.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup:
    uses: ./.github/workflows/setup-dependencies.yml

  render-html:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/uv
            /usr/share/texlive
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Sync Python dependencies
        run: uv sync

      - name: Install Chromium for Mermaid rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Render book to HTML
        run: |
          quarto render book/ --to html --verbose
        env:
          CHROME_BIN: /usr/bin/chromium-browser

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/_book/
          retention-days: 7
