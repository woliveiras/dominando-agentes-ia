name: Build Book

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome for Mermaid diagrams
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Test Chrome for Mermaid rendering
        run: |
          echo "=== Testando Chrome ==="
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          $CHROME_PATH --headless --disable-gpu --print-to-pdf=/tmp/test.pdf --no-sandbox about:blank 2>&1 | grep -v "ERROR:dbus" | grep -v "ERROR:object_proxy" || true
          sleep 2
          if [ -f "/tmp/test.pdf" ] && [ -s "/tmp/test.pdf" ]; then
            echo "✓ Chrome funcionando corretamente ($(stat -c%s /tmp/test.pdf) bytes)"
            rm /tmp/test.pdf
          else
            echo "✗ Chrome não conseguiu gerar PDF"
            ls -la /tmp/test.pdf 2>/dev/null || echo "Arquivo não existe"
            exit 1
          fi

      - name: Render book HTML
        timeout-minutes: 15
        run: |
          # Configuração do Chrome para ambiente CI
          export PUPPETEER_EXECUTABLE_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          export CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"

          # Flags otimizadas para evitar timeout e uso excessivo de recursos
          export PUPPETEER_ARGS="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-extensions --disable-dbus"

          # Timeout para operações do Puppeteer (30 segundos por diagrama)
          export PUPPETEER_TIMEOUT=30000

          # Debug: mostra configuração
          echo "=== Configuração de ambiente ==="
          echo "Chrome: $CHROME_BIN"
          echo "Quarto: $(quarto --version)"

          echo "=== Renderizando HTML ==="
          set +e  # Desabilita exit on error temporariamente
          quarto render book/ --to html --verbose 2>&1 | tee /tmp/quarto-render.log
          RENDER_EXIT=$?
          set -e  # Re-habilita exit on error

          # Verifica resultado
          if [ $RENDER_EXIT -ne 0 ]; then
            echo ""
            echo "✗ Erro no render (exit code: $RENDER_EXIT)"
            echo "=== Últimas 50 linhas do log ==="
            tail -50 /tmp/quarto-render.log
            echo ""
            echo "=== Estrutura de diretórios ==="
            ls -la book/ || true
            ls -la book/_book/ 2>/dev/null || echo "Diretório _book não foi criado"
            exit 1
          fi

          echo "✓ Renderização HTML concluída com sucesso"

      - name: Verify HTML generation
        run: |
          echo "=== Verificando arquivos HTML gerados ==="

          # Verifica se _book foi criado
          if [ ! -d "book/_book/" ]; then
            echo "✗ Diretório book/_book/ não foi criado!"
            echo "=== Últimas 100 linhas do log de renderização ==="
            tail -100 /tmp/quarto-render.log 2>/dev/null || echo "Log não encontrado"
            exit 1
          fi

          echo "Conteúdo de book/_book/:"
          ls -lh book/_book/

          # Verifica HTML
          echo ""
          echo "=== Verificando HTML ==="
          if [ -f "book/_book/index.html" ]; then
            echo "✓ HTML gerado com sucesso!"
            echo "Arquivos HTML encontrados:"
            find book/_book/ -name "*.html" -type f | head -10
          else
            echo "✗ index.html não encontrado!"
            exit 1
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-html-${{ steps.date.outputs.date }}
          path: book/_book/
          retention-days: 30
