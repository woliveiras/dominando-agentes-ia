        - chapters/appendix/E-prompt-patterns.qmd
    - chapters/99-references.qmd

bibliography: references.bib
lang: pt

css: styles.css

format:
  html:
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrreprt
    keep-tex: false
    keep-md: false
    pdf-engine: pdflatex
    cite-method: biblatex
    include-in-header:
      text: |
        \usepackage{fancyvrb}
        \usepackage{textcomp}
        \usepackage[utf8]{inputenc}
        \usepackage[T1]{fontenc}
        \usepackage{amsmath}
        \usepackage{amssymb}
        \DeclareUnicodeCharacter{221A}{\ensuremath{\sqrt{}}}
    execute:
      enabled: false
      echo: false
      warning: false
    fig-pos: 'H'
    toc: true
    toc-depth: 3
    number-sections: true
    mermaid:
      theme: default
      timeout: 60000
    mermaid-format: png
    fig-dpi: 150
    fig-format: png
  epub:
    mermaid-format: svg
    toc: true
    epub-cover-image: cover.png
    execute:
      enabled: false
