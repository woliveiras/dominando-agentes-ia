        - chapters/part-01/exercises/02-exercises.qmd
        - chapters/part-01/exercises/03-exercises.qmd
        - chapters/part-01/exercises/04-exercises.qmd
        - chapters/part-01/exercises/05-exercises.qmd
        - chapters/part-01/exercises/06-exercises.qmd
